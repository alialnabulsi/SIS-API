<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1220" viewBox="0 0 1680 1220" role="img" aria-labelledby="title desc"><title id="title">SIS API — System Architecture</title><desc id="desc">Balamandian mobile app calls its own backend. The backend calls protected SIS endpoints. Middleware runs before auth and member handlers. SIS application code verifies bcrypt hashes; PostgreSQL stores SIS data. Balamandian owns email OTP, application accounts and sessions.</desc>
<defs>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#2563EB"/></marker>
<marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#0F827C"/></marker>
<marker id="navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#14283F"/></marker>
<marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#7655BD"/></marker>
</defs>
<rect x="0" y="0" width="1680" height="1220" rx="0" fill="#F3F6FA"/>
<rect x="56" y="49" width="5" height="87" rx="2" fill="#2563EB"/>
<text x="78" y="65" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#2563EB" text-anchor="start">
<tspan x="78" dy="0">BALAMANDIAN / SIS INTEGRATION</tspan>
</text>
<text x="76" y="111" font-family="DejaVu Sans, Arial, sans-serif" font-size="38" font-weight="700" fill="#14283F" text-anchor="start">
<tspan x="76" dy="0">System architecture</tspan>
</text>
<text x="78" y="145" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#53677E" text-anchor="start">
<tspan x="78" dy="0">University identity verification and member retrieval, with clear ownership and request boundaries.</tspan>
</text>
<text x="64" y="210" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#53677E" text-anchor="start">
<tspan x="64" dy="0">BALAMANDIAN</tspan>
</text>
<rect x="64" y="234" width="340" height="168" rx="18" fill="#EEF4FF" stroke="#C5D7FA" stroke-width="1.5"/>
<rect x="88" y="256" width="78" height="28" rx="7" fill="#EAF1FF"/>
<text x="100" y="275" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#2563EB" text-anchor="start">
<tspan x="100" dy="0">CLIENT</tspan>
</text>
<text x="88" y="318" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="700" fill="#14283F" text-anchor="start">
<tspan x="88" dy="0">Mobile app</tspan>
</text>
<text x="88" y="349" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#53677E" text-anchor="start">
<tspan x="88" dy="0">SIS sign-in and profile flows</tspan>
<tspan x="88" dy="25">for university members</tspan>
</text>
<path d="M234 402 V488" fill="none" stroke="#2563EB" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/>
<text x="250" y="448" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#2563EB" text-anchor="start">
<tspan x="250" dy="0">HTTPS</tspan>
</text>
<rect x="64" y="490" width="340" height="312" rx="18" fill="#EDF9F6" stroke="#B8DFD8" stroke-width="1.5"/>
<rect x="88" y="514" width="132" height="28" rx="7" fill="#D7F0E9"/>
<text x="100" y="533" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#0F827C" text-anchor="start">
<tspan x="100" dy="0">APPLICATION</tspan>
</text>
<text x="88" y="579" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700" fill="#14283F" text-anchor="start">
<tspan x="88" dy="0">Balamandian backend</tspan>
</text>
<text x="88" y="618" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#53677E" text-anchor="start">
<tspan x="88" dy="0">Validates app requests</tspan>
<tspan x="88" dy="30">Calls SIS with a service key</tspan>
<tspan x="88" dy="30">Manages first-login email OTP</tspan>
<tspan x="88" dy="30">Creates application accounts</tspan>
<tspan x="88" dy="30">Issues application sessions</tspan>
</text>
<rect x="64" y="832" width="340" height="89" rx="18" fill="#FFF" stroke="#D7E1EC" stroke-width="1.5"/>
<text x="84" y="861" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700" fill="#14283F" text-anchor="start">
<tspan x="84" dy="0">Application data stays separate</tspan>
</text>
<text x="84" y="889" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" fill="#53677E" text-anchor="start">
<tspan x="84" dy="0">App storage / email service omitted.</tspan>
</text>
<rect x="490" y="196" width="1126" height="725" rx="24" fill="#FFF" stroke="#D7E1EC" stroke-width="1.5"/>
<text x="520" y="234" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#53677E" text-anchor="start">
<tspan x="520" dy="0">STANDALONE SIS SYSTEM</tspan>
</text>
<text x="520" y="265" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#14283F" text-anchor="start">
<tspan x="520" dy="0">Protected server-to-server interface</tspan>
</text>
<rect x="530" y="300" width="440" height="160" rx="18" fill="#EEF4FF" stroke="#C5D7FA" stroke-width="1.5"/>
<rect x="550" y="318" width="174" height="28" rx="7" fill="#EAF1FF"/>
<text x="562" y="337" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#2563EB" text-anchor="start">
<tspan x="562" dy="0">01 / REQUEST GATE</tspan>
</text>
<text x="550" y="378" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#14283F" text-anchor="start">
<tspan x="550" dy="0">Express API middleware</tspan>
</text>
<text x="550" y="410" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" fill="#53677E" text-anchor="start">
<tspan x="550" dy="0">Service-key authentication • Rate limiting</tspan>
<tspan x="550" dy="25">Request validation before handler execution</tspan>
</text>
<path d="M404 595 H450 V380 H530" fill="none" stroke="#0F827C" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)"/>
<text x="420" y="475" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#0F827C" text-anchor="middle">
<tspan x="420" dy="0">HTTPS</tspan>
</text>
<text x="1050" y="328" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#0F827C" text-anchor="start">
<tspan x="1050" dy="0">SERVICE AUTHENTICATION</tspan>
</text>
<text x="1050" y="364" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#53677E" text-anchor="start">
<tspan x="1050" dy="0">Authorization: Bearer &lt;service key&gt;</tspan>
<tspan x="1050" dy="28">Authenticates the Balamandian backend.</tspan>
<tspan x="1050" dy="28">The key remains on the server.</tspan>
</text>
<path d="M750 460 V511" fill="none" stroke="#2563EB" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/>
<rect x="530" y="513" width="440" height="270" rx="18" fill="#FFF" stroke="#D7E1EC" stroke-width="1.5"/>
<rect x="550" y="531" width="220" height="28" rx="7" fill="#EAF1FF"/>
<text x="562" y="550" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#2563EB" text-anchor="start">
<tspan x="562" dy="0">02 / ENDPOINT HANDLERS</tspan>
</text>
<text x="550" y="589" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#14283F" text-anchor="start">
<tspan x="550" dy="0">Auth module</tspan>
</text>
<text x="550" y="618" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600" fill="#2563EB" text-anchor="start">
<tspan x="550" dy="0">POST /api/v1/auth/verify</tspan>
</text>
<text x="550" y="645" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="400" fill="#53677E" text-anchor="start">
<tspan x="550" dy="0">Verify credentials with bcrypt in API code.</tspan>
</text>
<path d="M550 666 H950" fill="none" stroke="#E1E8F0" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="550" y="700" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#14283F" text-anchor="start">
<tspan x="550" dy="0">Members module</tspan>
</text>
<text x="550" y="729" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600" fill="#2563EB" text-anchor="start">
<tspan x="550" dy="0">GET /api/v1/members/:userId</tspan>
</text>
<text x="550" y="757" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="400" fill="#53677E" text-anchor="start">
<tspan x="550" dy="0">Read institutional data; sanitize the response.</tspan>
</text>
<rect x="1090" y="513" width="486" height="270" rx="18" fill="#F5F1FD" stroke="#D8CAEF" stroke-width="1.5"/>
<rect x="1112" y="531" width="160" height="28" rx="7" fill="#E9E0F8"/>
<text x="1124" y="550" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#7655BD" text-anchor="start">
<tspan x="1124" dy="0">03 / DATA STORE</tspan>
</text>
<text x="1112" y="590" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#14283F" text-anchor="start">
<tspan x="1112" dy="0">PostgreSQL · SIS database</tspan>
</text>
<text x="1112" y="628" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" fill="#53677E" text-anchor="start">
<tspan x="1112" dy="0">Users, password hashes and roles</tspan>
<tspan x="1112" dy="29">Student / instructor information</tspan>
<tspan x="1112" dy="29">Campuses, programs, departments, faculties</tspan>
</text>
<text x="1112" y="747" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="400" fill="#7655BD" text-anchor="start">
<tspan x="1112" dy="0">Only SIS application code accesses this database.</tspan>
</text>
<path d="M970 608 H1090" fill="none" stroke="#7655BD" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#purple)"/>
<text x="1030" y="589" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#7655BD" text-anchor="middle">
<tspan x="1030" dy="0">Read / update</tspan>
</text>
<path d="M970 723 H1090" fill="none" stroke="#7655BD" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#purple)"/>
<text x="1030" y="705" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#7655BD" text-anchor="middle">
<tspan x="1030" dy="0">Read only</tspan>
</text>
<rect x="530" y="817" width="1046" height="72" rx="12" fill="#F5F8FB"/>
<text x="550" y="844" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#53677E" text-anchor="start">
<tspan x="550" dy="0">SHARED RESPONSE HANDLING</tspan>
</text>
<text x="550" y="871" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="400" fill="#14283F" text-anchor="start">
<tspan x="550" dy="0">Sanitized JSON on success • Centralized error handling • No passwords or password hashes in responses</tspan>
</text>
<text x="64" y="966" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="400" fill="#53677E" text-anchor="start">
<tspan x="64" dy="0">Arrows show request or data-access direction. Responses return along the same connection.</tspan>
</text>
<rect x="64" y="999" width="492" height="160" rx="18" fill="#EEF4FF"/>
<text x="86" y="1027" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#2563EB" text-anchor="start">
<tspan x="86" dy="0">BOUNDARY 01</tspan>
</text>
<text x="86" y="1064" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#14283F" text-anchor="start">
<tspan x="86" dy="0">No direct mobile → SIS calls</tspan>
</text>
<text x="86" y="1099" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="400" fill="#53677E" text-anchor="start">
<tspan x="86" dy="0">The app talks to Balamandian’s backend.</tspan>
<tspan x="86" dy="25">Only that backend holds the SIS service key.</tspan>
</text>
<rect x="578" y="999" width="492" height="160" rx="18" fill="#F5F1FD"/>
<text x="600" y="1027" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#7655BD" text-anchor="start">
<tspan x="600" dy="0">BOUNDARY 02</tspan>
</text>
<text x="600" y="1064" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#14283F" text-anchor="start">
<tspan x="600" dy="0">SIS verifies university identity</tspan>
</text>
<text x="600" y="1099" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="400" fill="#53677E" text-anchor="start">
<tspan x="600" dy="0">SIS checks credentials and returns member data.</tspan>
<tspan x="600" dy="25">Successful verification updates last_login_at.</tspan>
</text>
<rect x="1092" y="999" width="524" height="160" rx="18" fill="#EDF9F6"/>
<text x="1114" y="1027" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#0F827C" text-anchor="start">
<tspan x="1114" dy="0">BOUNDARY 03</tspan>
</text>
<text x="1114" y="1064" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#14283F" text-anchor="start">
<tspan x="1114" dy="0">Balamandian owns app access</tspan>
</text>
<text x="1114" y="1099" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="400" fill="#53677E" text-anchor="start">
<tspan x="1114" dy="0">First login requires successful email OTP verification.</tspan>
<tspan x="1114" dy="25">Balamandian creates accounts and issues sessions.</tspan>
</text>
</svg>